services:
  - type: web
    name: okugasegi-web
    runtime: node
    plan: free
    region: singapore
    rootDir: deploy/okugasegi-web
    buildCommand: "cat bundle.part.* | base64 -d > /tmp/okugasegi.zip && mkdir -p app && unzip -q -o /tmp/okugasegi.zip -d app && cd app && npm install --omit=dev && npm run check && npm test"
    startCommand: "cd app && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
