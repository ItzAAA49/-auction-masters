services:
  - type: web
    name: okugasegi-web
    runtime: node
    plan: free
    region: singapore
    rootDir: deploy/okugasegi-web
    buildCommand: "node -e \"const f=require('fs'),z=require('zlib');f.writeFileSync('/tmp/okugasegi.tar',z.brotliDecompressSync(Buffer.from(f.readFileSync('payload.part.*','utf8'),'base64')))\" && mkdir -p app && tar -xf /tmp/okugasegi.tar -C app && cd app && npm install --omit=dev && npm run check && npm test"
    startCommand: "cd app && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
